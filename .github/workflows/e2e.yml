name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Pack package
        run: npm pack

      - name: Install quickstart fixture dependencies
        run: npm ci
        working-directory: e2e/fixtures/hydrogen-quickstart

      - name: Install pack fixture dependencies
        run: npm ci
        working-directory: e2e/fixtures/hydrogen-pack

      - name: Install Playwright dependencies
        run: npm ci
        working-directory: e2e

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: e2e

      - name: Create quickstart .env
        working-directory: e2e/fixtures/hydrogen-quickstart
        run: |
          cat > .env << EOF
          SESSION_SECRET=e2e-ci-secret
          PUBLIC_STOREFRONT_API_TOKEN=${{ secrets.SHOPIFY_QUICKSTART_STOREFRONT_TOKEN }}
          PUBLIC_STORE_DOMAIN=${{ secrets.SHOPIFY_QUICKSTART_STORE_DOMAIN }}
          PUBLIC_REDO_STORE_ID=${{ secrets.REDO_QUICKSTART_STORE_ID }}
          PUBLIC_TEST_PRODUCT_HANDLE=${{ secrets.SHOPIFY_QUICKSTART_PRODUCT_HANDLE }}
          EOF

      - name: Create pack .env
        working-directory: e2e/fixtures/hydrogen-pack
        run: |
          cat > .env << EOF
          SESSION_SECRET=e2e-ci-secret
          PUBLIC_STOREFRONT_API_TOKEN=${{ secrets.SHOPIFY_PACK_STOREFRONT_TOKEN }}
          PUBLIC_STORE_DOMAIN=${{ secrets.SHOPIFY_PACK_STORE_DOMAIN }}
          PUBLIC_REDO_STORE_ID=${{ secrets.REDO_PACK_STORE_ID }}
          PUBLIC_TEST_PRODUCT_HANDLE=${{ secrets.SHOPIFY_PACK_PRODUCT_HANDLE }}
          EOF

      - name: Run E2E tests
        run: npx playwright test
        working-directory: e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14
